<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>
    <meta charset="UTF-8">
    <title>판매자 추천 미리보기 | MatchEAT</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/product.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>
    <section class="product-page-header">
        <div>
            <h1>판매자 추천 미리보기</h1>
            <p>내 판매 조건에 대해 어떤 주문 요청이 잘 맞는지, 거리·예산·카테고리·평점·텍스트 유사도 점수를 확인합니다.</p>
        </div>
    </section>

    <div class="product-toolbar">
        <a th:href="@{/product}">📋 판매 조건 목록</a>
        <a th:href="@{/product/new}">➕ 판매 조건 등록</a>
    </div>

    <div class="product-form-lookup">
        <label for="productId">내 상품 ID</label>
        <input type="number" id="productId" min="1" placeholder="productId 입력, 예: 3">
        <button id="fetchBtn" class="button" type="button">불러오기</button>
    </div>

    <div id="errorBox" class="product-form-message is-error" style="display:none;"></div>

    <div id="result" class="product-rec-list"></div>

    <p class="product-form-hint" id="toggleRaw" style="cursor:pointer; margin-top:16px;">원본 JSON 보기</p>
    <pre id="rawJson" style="display:none;"><code></code></pre>
</main>

<script type="module" th:src="@{/product/js/product-recommendations.js}"></script>
</body>
</html>
