<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>견적 요청 상세 | MatchEAT</title>

    <link rel="stylesheet"
          th:href="@{/css/common.css}">

    <link rel="stylesheet"
          th:href="@{/css/estimate.css}">
</head>

<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="estimate-detail-page">

    <section class="estimate-detail-header">
        <div>
            <p class="estimate-detail-kicker">
                ESTIMATE REQUEST
            </p>

            <h1>견적 요청 상세</h1>

            <p>
                상품 판매자에게 전달된 요청 조건을 확인할 수 있습니다.
            </p>
        </div>

        <span id="estimateStatus"
              class="estimate-detail-status">
            확인 중
        </span>
    </section>

    <div id="estimateDetailLoading"
         class="estimate-detail-state">
        견적 요청 정보를 불러오고 있습니다.
    </div>

    <div id="estimateDetailError"
         class="estimate-detail-state estimate-detail-state-error"
         hidden>
    </div>

    <div id="estimateDetailContent"
         hidden>

        <section class="estimate-detail-card">

            <div class="estimate-detail-section-heading">
                <div>
                    <h2>상품 정보</h2>

                    <p>
                        견적을 요청한 상품입니다.
                    </p>
                </div>

                <a id="estimateProductLink"
                   class="estimate-detail-text-link"
                   href="#"
                   hidden>
                    상품 상세 보기
                </a>
            </div>

            <div class="estimate-detail-product">
                <span>상품명</span>

                <strong id="estimateItemName">
                    -
                </strong>
            </div>

        </section>

        <section class="estimate-detail-card">

            <div class="estimate-detail-section-heading">
                <div>
                    <h2>요청 조건</h2>

                    <p id="estimateDirection">
                        전달한 요청 조건을 확인해 주세요.
                    </p>
                </div>
            </div>

            <div class="estimate-detail-grid">

                <div class="estimate-detail-field">
                    <span>요청 수량</span>
                    <strong id="estimateQuantity">-</strong>
                </div>

                <div class="estimate-detail-field">
                    <span>예산 유형</span>
                    <strong id="estimateBudgetType">-</strong>
                </div>

                <div class="estimate-detail-field">
                    <span>예산</span>
                    <strong id="estimateBudget">-</strong>
                </div>

                <div class="estimate-detail-field">
                    <span>행사/이용 일시</span>
                    <strong id="estimateEventDateTime">-</strong>
                </div>
                <div class="estimate-detail-field">
                    <span>배송/행사 주소</span>
                    <strong id="estimateDeliveryAddress">-</strong>
                </div>

                <div class="estimate-detail-field">
                    <span>상세 주소</span>
                    <strong id="estimateDeliveryAddressDetail">-</strong>
                </div>

                <div class="estimate-detail-field estimate-detail-field-wide">
                    <span>요청 일시</span>
                    <strong id="estimateCreatedAt">-</strong>
                </div>

            </div>

        </section>

        <section class="estimate-detail-card">

            <div class="estimate-detail-section-heading">
                <div>
                    <h2>요청 사항</h2>

                    <p>
                        구매자가 판매자에게 전달한 추가 요청 내용입니다.
                    </p>
                </div>
            </div>

            <p id="estimateDescription"
               class="estimate-detail-description">
                -
            </p>

        </section>

        <div class="estimate-detail-actions">

            <a id="estimateBackButton"
               class="estimate-detail-button estimate-detail-button-secondary"
               href="/mypage/buying-estimates">
                협의 목록으로
            </a>

            <a id="estimateProductButton"
               class="estimate-detail-button estimate-detail-button-primary"
               href="#"
               hidden>
                상품 보기
            </a>

        </div>

    </div>

</main>

<script type="module"
        th:src="@{/estimate/js/estimate-detail.js}">
</script>

</body>
</html>
