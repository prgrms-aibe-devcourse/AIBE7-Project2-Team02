<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>견적 요청 | MatchEAT</title>

    <link rel="stylesheet"
          th:href="@{/css/common.css}">

    <link rel="stylesheet"
          th:href="@{/css/estimate.css}">

    <script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>

<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="estimate-create-page">

    <div class="estimate-page-header">
        <h1>견적 요청</h1>

        <p>
            선택한 상품을 기준으로 판매자에게 전달할 요청 조건을 작성해주세요.
        </p>
    </div>

    <div id="missingProductNotice"
         class="estimate-notice"
         hidden>
        상품 정보가 없습니다.
        상품 상세 페이지에서 견적 요청하기를 이용해주세요.
    </div>

    <!-- 견적 요청 대상 상품 -->
    <section id="productSummary"
             class="estimate-product-summary"
             hidden>

        <div class="estimate-section-heading">
            <h2>상품 정보</h2>

            <a id="productDetailLink"
               class="estimate-product-link"
               href="#">
                상품 상세 보기
            </a>
        </div>

        <div class="estimate-summary-grid">

            <div>
                <span class="estimate-summary-label">
                    상품명
                </span>

                <strong data-product-summary="name">
                    조회 중
                </strong>
            </div>

            <div>
                <span class="estimate-summary-label">
                    카테고리
                </span>

                <strong data-product-summary="category">
                    -
                </strong>
            </div>

            <div>
                <span class="estimate-summary-label">
                    1인분 가격
                </span>

                <strong>
                    <span data-product-summary="price">-</span>원
                </strong>
            </div>

            <div>
                <span class="estimate-summary-label">
                    주문 가능 수량
                </span>

                <strong data-product-summary="headcount">
                    -
                </strong>
            </div>

        </div>

    </section>

    <form id="estimateForm"
          class="estimate-form-card"
          hidden>

        <h2>요청 조건</h2>

        <input type="hidden"
               id="itemName">

        <div class="estimate-form-row">

            <div class="estimate-form-field">
                <label for="eventDateTime">
                    행사/이용 일시
                </label>

                <input type="datetime-local"
                       id="eventDateTime"
                       required>
            </div>

            <div class="estimate-form-field">
                <label for="quantity">
                    요청 수량
                </label>

                <div class="estimate-input-unit">
                    <input type="number"
                           id="quantity"
                           min="1"
                           step="1"
                           placeholder="예: 20"
                           required>

                    <span>인분</span>
                </div>

                <p id="quantityHint"
                   class="estimate-form-hint">
                    선택한 상품의 주문 가능 수량을 확인해주세요.
                </p>
            </div>

        </div>

        <div class="estimate-form-row">

            <div class="estimate-form-field">
                <label for="budgetType">
                    예산 유형
                </label>

                <select id="budgetType"
                        required>
                    <option value="">
                        예산 유형을 선택해주세요
                    </option>

                    <option value="PER_PERSON">
                        1인당 예산
                    </option>

                    <option value="TOTAL">
                        총 예산
                    </option>
                </select>
            </div>

            <div class="estimate-form-field">
                <label for="budget">
                    예산
                </label>

                <div class="estimate-input-unit">
                    <input type="number"
                           id="budget"
                           min="1"
                           step="1"
                           placeholder="예: 15000"
                           required>

                    <span>원</span>
                </div>

                <p id="budgetGuide"
                   class="estimate-form-hint">
                    예산 유형과 수량을 입력하면 예상 금액을 확인할 수 있습니다.
                </p>
            </div>

        </div>

        <div class="estimate-form-field estimate-form-full">

            <label for="deliveryAddress">
                배송/행사 주소
            </label>

            <div class="estimate-address-row">

                <input type="text"
                       id="deliveryAddress"
                       placeholder="배송 또는 행사 장소를 입력해주세요."
                       autocomplete="street-address"
                       required>

                <button type="button"
                        id="addressSearchButton"
                        class="estimate-address-button">
                    주소 검색
                </button>

            </div>

            <p class="estimate-form-hint">
                입력한 주소를 기준으로 판매자의 배송 가능 여부를 확인할 수 있습니다.
            </p>

        </div>

        <div class="estimate-form-field estimate-form-full">

            <label for="description">
                요청 사항
            </label>

            <textarea id="description"
                      rows="6"
                      maxlength="1000"
                      placeholder="메뉴 구성, 포장 방식, 알레르기, 배송 시간 등 판매자에게 전달할 내용을 입력해주세요."></textarea>

        </div>

        <div id="estimateError"
             class="estimate-form-error"
             hidden>
        </div>

        <div class="estimate-form-actions">

            <a id="estimateCancelButton"
               class="estimate-cancel-button"
               href="/product">
                취소
            </a>

            <button type="submit"
                    id="estimateSubmitButton"
                    class="estimate-submit-button">
                견적 요청 보내기
            </button>

        </div>

    </form>

</main>

<script type="module"
        th:src="@{/estimate/js/estimate-form.js}">
</script>

</body>
</html>
