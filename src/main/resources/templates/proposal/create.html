<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>
    <meta charset="UTF-8">
    <title>제안 작성 | MatchEAT</title>

    <link rel="stylesheet"
          th:href="@{/css/common.css}">

    <link rel="stylesheet"
          th:href="@{/css/proposal.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>

    <div class="proposal-page-header">
        <h1>제안 작성</h1>
        <p>
            주문 조건을 확인하고 구매자에게 전달할 제안 내용을 작성해주세요.
        </p>
    </div>

    <!-- 제안 대상 주문 요약 -->
    <div class="proposal-order-summary">

        <h2>주문 정보</h2>

        <div class="proposal-summary-grid">

            <div>
                <span class="proposal-summary-label">주문 제목</span>
                <strong data-order-summary="title">조회 중</strong>
            </div>

            <div>
                <span class="proposal-summary-label">수량</span>
                <strong>
                    <span data-order-summary="quantity">-</span>명
                </strong>
            </div>

            <div>
                <span class="proposal-summary-label">예산</span>

                <strong>
                    <span data-order-summary="budgetType">-</span>
                    <span data-order-summary="budget">-</span>원
                </strong>
            </div>

            <div>
                <span class="proposal-summary-label">카테고리</span>
                <strong data-order-summary="category">-</strong>
            </div>

        </div>

    </div>

    <form id="proposalForm"
          class="proposal-form-card"
          th:attr="data-request-id=${requestId}"
          hidden>

        <h2>제안 방식</h2>

        <div class="proposal-mode-buttons">

            <button type="button"
                    class="proposal-mode-button is-active"
                    data-proposal-mode="product">
                등록한 상품으로 제안
            </button>

            <button type="button"
                    class="proposal-mode-button"
                    data-proposal-mode="manual">
                직접 입력하여 제안
            </button>

        </div>

        <div id="registeredProductArea"
             class="proposal-form-field proposal-form-full">

            <label for="registeredProduct">
                등록 상품
            </label>

            <select id="registeredProduct">
                <option value="">
                    상품을 선택해주세요
                </option>
            </select>

            <p id="registeredProductHint"
               class="proposal-form-hint">
                등록된 상품을 선택하면 상품명과 단가가 자동으로 입력됩니다.
            </p>

            <div id="productPreview"
                 class="proposal-product-preview"
                 hidden>

                <img id="productPreviewImage"
                     alt="등록 상품 이미지"
                     hidden>

                <div>
                    <strong id="productPreviewName"></strong>
                    <p id="productPreviewDescription"></p>
                </div>

            </div>

        </div>

        <div class="proposal-form-row">

            <div class="proposal-form-field">
                <label for="itemName">상품/메뉴명</label>

                <input type="text"
                       id="itemName"
                       maxlength="100"
                       required
                       readonly>
            </div>

            <div class="proposal-form-field">
                <label for="quantity">제안 수량</label>

                <input type="number"
                       id="quantity"
                       min="1"
                       required>
            </div>

        </div>

        <div class="proposal-form-row">

            <div class="proposal-form-field">
                <label for="unitPrice">1인 단가</label>

                <input type="number"
                       id="unitPrice"
                       min="1"
                       required
                       readonly>
            </div>

            <div class="proposal-form-field">
                <label for="totalAmount">최종 제안 금액</label>

                <input type="number"
                       id="totalAmount"
                       min="1"
                       required>

                <p class="proposal-form-hint">
                    할인 등 최종 조건을 반영해 직접 수정할 수 있습니다.
                </p>
            </div>

        </div>

        <div class="proposal-form-field proposal-form-full">
            <label for="preparationDays">
                준비 기간
            </label>

            <div class="proposal-preparation-input">
                <input type="number"
                       id="preparationDays"
                       min="1"
                       value="1"
                       required>

                <span>일</span>
            </div>
        </div>

        <div class="proposal-form-field proposal-form-full">
            <label for="description">
                제안 설명
            </label>

            <textarea id="description"
                      rows="6"
                      maxlength="1000"
                      placeholder="메뉴 구성, 포장 방식, 음료 제공 여부 등 제안 내용을 입력해주세요."></textarea>
        </div>

        <div class="proposal-form-actions">

            <a th:href="@{/requests/{id}(id=${requestId})}"
               class="proposal-cancel-button">
                취소
            </a>

            <button type="submit"
                    class="proposal-submit-button">
                제안 보내기
            </button>

        </div>

    </form>

</main>

<script type="module"
        th:src="@{/proposal/js/proposal-form.js}">
</script>

</body>
</html>
