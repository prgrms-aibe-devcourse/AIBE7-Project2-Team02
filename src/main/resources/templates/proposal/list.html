<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>제안 관리 | MatchEAT</title>

    <link rel="stylesheet"
          th:href="@{/css/common.css}">

    <link rel="stylesheet"
          th:href="@{/css/proposal.css}">
</head>

<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>

    <section class="proposal-list-header">

        <div>
            <h1>제안 관리</h1>

            <p>
                받은 제안과 내가 보낸 제안을 확인할 수 있습니다.
            </p>
        </div>

    </section>

    <section class="proposal-list-card"
             th:fragment="proposal-list-content">

        <div class="proposal-list-tabs">

            <button type="button"
                    class="proposal-list-tab is-active"
                    data-proposal-tab="received">
                받은 제안
            </button>

            <button type="button"
                    class="proposal-list-tab"
                    data-proposal-tab="sent">
                보낸 제안
            </button>

        </div>

        <!-- 받은 제안 비교 선택 영역 -->
        <div id="proposalCompareToolbar"
             class="proposal-compare-toolbar"
             hidden>

            <div class="proposal-compare-summary">
                <strong>제안 비교</strong>

                <span id="proposalCompareCount">
                    0개 선택
                </span>

                <span class="proposal-compare-hint">
                    같은 주문의 제안을 최대 3개까지 비교할 수 있습니다.
                </span>
            </div>

            <div class="proposal-compare-actions">

                <button id="proposalCompareResetButton"
                        type="button"
                        class="proposal-compare-reset-button"
                        disabled>
                    선택 초기화
                </button>

                <button id="proposalCompareButton"
                        type="button"
                        class="proposal-compare-button"
                        disabled>
                    선택한 제안 비교
                </button>

            </div>

        </div>

        <div id="proposalList"
             class="proposal-list">

            <div class="proposal-list-empty">
                제안 목록을 불러오는 중입니다.
            </div>

        </div>

        <!-- 선택한 제안 비교 결과 -->
        <section id="proposalComparison"
                 class="proposal-comparison"
                 hidden>

            <div class="proposal-comparison-header">

                <div>
                    <h2>제안 비교</h2>

                    <p>
                        선택한 제안의 주요 조건을 한눈에 비교해보세요.
                    </p>
                </div>

                <button id="proposalComparisonCloseButton"
                        type="button"
                        class="proposal-comparison-close-button">
                    닫기
                </button>

            </div>

            <div id="proposalComparisonTable"
                 class="proposal-comparison-table-wrap">
            </div>

        </section>

    </section>

</main>

<script type="module"
        th:src="@{/proposal/js/proposal-list.js}">
</script>

</body>
</html>
