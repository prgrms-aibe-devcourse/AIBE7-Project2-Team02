<!doctype html>
<html lang="ko">

<head>
    <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>로그인 | MatchEAT</title>

    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/account/css/account-auth.css">
</head>

<body class="account-page">

<header class="account-header">
    <div class="account-header-inner">
        <a href="/"
           class="account-logo">
            MatchEAT
        </a>
    </div>
</header>

<main class="account-main">

    <!-- MatchEAT 계정으로 로그인하는 영역이다. -->
    <section class="account-card"
             aria-labelledby="login-title">

        <div class="account-card-header">
            <h1 id="login-title">로그인</h1>

            <p>
                이메일과 비밀번호를 입력해주세요.
            </p>
        </div>

        <form id="account-login-form"
              class="account-form"
              novalidate>

            <div class="account-field">
                <label for="email">이메일</label>

                <input id="email"
                       name="email"
                       type="email"
                       autocomplete="email"
                       maxlength="254"
                       placeholder="example@email.com"
                       required>

                <p class="account-field-message"
                   data-field-error="email"
                   aria-live="polite">
                </p>
            </div>

            <div class="account-field">
                <label for="password">비밀번호</label>

                <input id="password"
                       name="password"
                       type="password"
                       autocomplete="current-password"
                       maxlength="64"
                       placeholder="비밀번호를 입력해주세요"
                       required>

                <p class="account-field-message"
                   data-field-error="password"
                   aria-live="polite">
                </p>
            </div>

            <p id="account-form-message"
               class="account-message"
               role="alert"
               aria-live="polite">
            </p>

            <button class="account-submit"
                    type="submit">
                로그인
            </button>

        </form>

        <div class="account-switch">
            <span>아직 계정이 없나요?</span>
            <a href="/signup">회원가입</a>
        </div>

    </section>

</main>

<script type="module"
        src="/account/js/login.js">
</script>

</body>
</html>
