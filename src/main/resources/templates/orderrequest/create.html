<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문 등록 | MatchEAT</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/order.css}">
    <script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>
<body>

<!-- 주문 요청 정보를 입력받는 Thymeleaf 등록 페이지 -->
<header th:replace="~{fragments/header :: header}"></header>

<main class="order-form-page">
    <!-- 신규 주문 등록 페이지의 제목과 안내 영역 -->
    <section class="order-form-header">
        <p class="order-page-kicker">주문 등록</p>
        <h1>새 주문 요청 등록</h1>
        <p>필요한 음식과 행사 조건을 입력하면 조건에 맞는 상품을 찾아볼 수 있습니다.</p>
    </section>

    <!-- 신규 주문 정보를 입력하는 폼 영역 -->
    <form id="orderRequestForm"
          class="order-form-card"
          th:object="${orderRequest}"
          data-mode="create">

        <!-- 주문 제목과 행사/배송 일시 입력 영역 -->
        <div class="order-form-row">

            <div class="order-form-field">
                <label for="title">주문 제목</label>

                <input type="text"
                       id="title"
                       th:field="*{title}"
                       maxlength="100"
                       placeholder="주문 내용을 한눈에 알 수 있는 제목을 입력해주세요"
                       required>
            </div>

            <div class="order-form-field">
                <label for="eventDateTime">행사/배송 일시</label>

                <input type="datetime-local"
                       id="eventDateTime"
                       th:field="*{eventDateTime}"
                       required>
            </div>

        </div>

        <!-- 수량과 희망 예산 입력 영역 -->
        <div class="order-form-row">

            <div class="order-form-field">
                <label for="quantity">수량</label>

                <input type="number"
                       id="quantity"
                       th:field="*{quantity}"
                       min="1"
                       placeholder="예: 30"
                       required>
            </div>

            <div class="order-form-field">
                <label>희망 예산</label>

                <div class="order-budget-inputs">
                    <select id="budgetType"
                            th:field="*{budgetType}"
                            required>
                        <option value="">예산 기준</option>
                        <option value="PER_PERSON">1인당</option>
                        <option value="TOTAL">총 예산</option>
                    </select>

                    <input type="number"
                           id="budget"
                           th:field="*{budget}"
                           min="1"
                           placeholder="예산 금액을 입력해주세요"
                           required>
                </div>
            </div>

        </div>

        <!-- 음식 카테고리 입력 영역 -->
        <div class="order-form-field order-form-full">
            <label for="category">음식 카테고리</label>

            <select id="category"
                    th:field="*{category}"
                    required>
                <option value="">선택해주세요</option>
                <option value="한식">한식</option>
                <option value="중식">중식</option>
                <option value="일식">일식</option>
                <option value="양식">양식</option>
                <option value="도시락/간편식">도시락/간편식</option>
                <option value="디저트/다과">디저트/다과</option>
                <option value="카페/음료">카페/음료</option>
                <option value="비건">비건</option>
                <option value="기타">기타</option>
            </select>

            <div id="customCategoryArea"
                 class="order-form-field order-custom-category"
                 hidden>

                <label for="customCategory">기타 카테고리</label>

                <input type="text"
                       id="customCategory"
                       maxlength="50"
                       placeholder="원하는 카테고리를 입력해주세요">
            </div>
        </div>

        <!-- 배송지와 상세 주소 입력 영역 -->
        <div class="order-form-row">

            <div class="order-form-field">
                <label for="deliveryAddress">
                    배송지
                </label>

                <div class="order-address-inputs">
                    <input type="text"
                           id="deliveryAddress"
                           th:field="*{deliveryAddress}"
                           placeholder="주소 검색을 이용해주세요"
                           autocomplete="street-address"
                           required>

                    <button type="button"
                            id="addressSearchButton"
                            class="order-address-search">
                        주소 검색
                    </button>
                </div>

                <p class="order-form-help">
                    이 주소를 기준으로 배송 가능 여부를 확인합니다.
                </p>
            </div>

            <div class="order-form-field">
                <label for="deliveryAddressDetail">
                    상세 주소
                </label>

                <input type="text"
                       id="deliveryAddressDetail"
                       th:field="*{deliveryAddressDetail}"
                       maxlength="255"
                       autocomplete="address-line2"
                       placeholder="예: 101동 202호 / 3층 행사장"
                       required>

                <p class="order-form-help">
                    실제 배송 위치를 상세하게 입력해주세요.
                </p>
            </div>

        </div>
        <!-- 상세 요청사항 입력 영역 -->
        <div class="order-form-field order-form-full">
            <label for="description">상세 요청사항</label>

            <textarea id="description"
                      th:field="*{description}"
                      maxlength="1000"
                      rows="5"
                      placeholder="메뉴 구성, 포장 방식, 알레르기 등 필요한 요청사항을 입력해주세요"></textarea>
        </div>

        <!-- 주문 이해를 돕기 위한 참고 이미지 입력 영역 -->
        <div class="order-form-field order-form-full">
            <label for="imageFile">참고 이미지</label>

            <input type="file"
                   id="imageFile"
                   accept="image/*">

            <p class="order-image-help">
                원하는 메뉴나 구성의 참고 이미지를 선택할 수 있습니다.
            </p>

            <div id="imagePreviewArea"
                 class="order-image-preview-area"
                 hidden>

                <img id="imagePreview"
                     class="order-image-preview"
                     alt="참고 이미지 미리보기">
            </div>
        </div>

        <!-- 주문 작성 취소 및 등록 액션 영역 -->
        <div class="order-form-actions">

            <a th:href="@{/requests}"
               class="order-form-cancel">
                작성 취소
            </a>

            <button type="submit"
                    class="order-form-submit">
                주문 등록
            </button>

        </div>

    </form>
</main>

<script type="module"
        th:src="@{/order/js/order-request-form.js}">
</script>

</body>
</html>
