<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>
    <meta charset="UTF-8">
    <title>주문 상세 | MatchEAT</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/order.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main id="orderDetailPage"
      class="order-detail-page"
      th:attr="data-request-id=${requestId}">

    <section class="order-detail-header">
        <div class="order-detail-heading">
            <p class="order-page-kicker">주문 상세</p>

            <h1 data-order-field="title">
                주문 정보를 불러오는 중입니다.
            </h1>

            <p>
                등록된 주문의 상세 조건과 진행 상태를 확인할 수 있습니다.
            </p>
        </div>

        <span id="orderStatus"
              class="order-status">
        조회 중
    </span>
    </section>

    <section id="orderLoading"
             class="order-detail-card">
        <p>주문 정보를 불러오고 있습니다.</p>
    </section>

    <section id="orderError"
             class="order-detail-card"
             hidden>
        <p></p>
    </section>

    <div id="orderContent"
         hidden>

        <section class="order-detail-card">
            <div class="order-detail-card-header">
                <h2>주요 주문 조건</h2>
                <p>매칭에 사용되는 주요 주문 조건입니다.</p>
            </div>

            <div class="order-detail-summary">

                <div class="order-detail-summary-item">
            <span class="order-detail-label">
                행사·배송 일시
            </span>

                    <strong data-order-field="eventDateTime"></strong>
                </div>

                <div class="order-detail-summary-item">
            <span class="order-detail-label">
                수량
            </span>

                    <span>
                <strong data-order-field="quantity"></strong>명
            </span>
                </div>

                <div class="order-detail-summary-item">
            <span class="order-detail-label">
                예산
            </span>

                    <strong class="order-detail-budget"
                            data-order-field="budget"></strong>
                </div>

                <div class="order-detail-summary-item">
            <span class="order-detail-label">
                음식 카테고리
            </span>

                    <strong data-order-field="category"></strong>
                </div>

            </div>

            <div class="order-detail-address">

                <div>
        <span class="order-detail-label">
            배송지
        </span>

                    <span data-order-field="deliveryAddress"></span>
                </div>

                <div>
        <span class="order-detail-label">
            상세 주소
        </span>

                    <span data-order-field="deliveryAddressDetail"></span>
                </div>

            </div>
        </section>

        <section class="order-detail-card">
            <div class="order-detail-card-header">
                <h2>상세 요청사항</h2>
            </div>

            <p class="order-detail-description"
               data-order-field="description">
            </p>
        </section>

        <!-- 참고 이미지가 등록된 주문에만 표시한다. -->
        <section id="referenceImageSection"
                 class="order-detail-card"
                 hidden>

            <div class="order-detail-card-header">
                <h2>참고 이미지</h2>
                <p>원하는 메뉴나 구성에 참고할 이미지입니다.</p>
            </div>

            <img id="referenceImage"
                 class="order-detail-reference-image"
                 alt="주문 참고 이미지">
        </section>

        <section class="order-detail-actions">

            <a th:href="@{/requests}"
               class="order-detail-back">
                목록으로
            </a>

            <div id="orderOwnerActions"
                 class="order-detail-action-group"
                 hidden>

                <a id="matchingLink"
                   class="order-detail-button order-detail-match">
                    매칭 결과 보기
                </a>

                <a id="editLink"
                   class="order-detail-button order-detail-edit">
                    주문 수정
                </a>

                <button type="button"
                        id="cancelOrderButton"
                        class="order-detail-button order-detail-cancel">
                    주문 취소
                </button>

            </div>

            <div id="orderSellerActions"
                 class="order-detail-action-group"
                 hidden>

                <a id="proposalLink"
                   class="order-detail-button order-detail-proposal">
                    제안하기
                </a>

                <button type="button"
                        id="sellerChatButton"
                        class="order-detail-button order-detail-proposal">
                    💬 바로 채팅하기
                </button>

            </div>

        </section>

    </div>

</main>

<script type="module"
        th:src="@{/order/js/order-request-detail.js}">
</script>

</body>
</html>
